<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme AP Console</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='32 24 192 208'%3E%3Cstyle%3E@media (prefers-color-scheme:dark){path{fill:%23edede9}}%3C/style%3E%3Cpath fill='%23111' d='M80 32 H128 A16 16 0 0 1 144 48 V72 A16 16 0 0 0 160 88 H184 A16 16 0 0 1 200 104 V200 A24 24 0 0 1 176 224 H80 A24 24 0 0 1 56 200 V56 A24 24 0 0 1 80 32 Z'/%3E%3Ccircle fill='%23ff5a1f' cx='180' cy='52' r='20'/%3E%3C/svg%3E"
    />
    <script>
      // Set the theme before first paint, so there is no flash of the wrong one.
      try {
        const saved = localStorage.getItem("theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
