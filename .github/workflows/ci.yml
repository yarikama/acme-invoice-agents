name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The assistant's shared memory is tested against a real Redis.
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 2s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      # OCR for the scanned invoices.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest --cov

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The Docker path a grader may take: build, start, run the spec command.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait
      - name: The API and the console answer on :8000
        run: |
          curl -sf localhost:8000/api/health | grep '"status":"ok"'
          curl -sf localhost:8000/ | grep -q "<title>"
      - name: The spec command, through the CLI container
        run: |
          docker compose run --rm -T cli --invoice_path=data/invoices/invoice_1001.txt --once --json > out.json
          python3 -c "import json; [r] = json.load(open('out.json')); assert r['status'] == 'paid', r"
      - if: always()
        run: docker compose logs --no-color api | tail -50; docker compose down -v
