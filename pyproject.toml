[project]
name = "acme-invoice-agents"
version = "0.1.0"
description = "Multi-agent invoice processing for Acme Corp: ingest, validate, approve, pay"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Henry Hsu", email = "hsuhengjui@gmail.com" }]
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain-core>=1.5",
    "langchain-xai>=1.3",
    "langchain-openai>=1.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "defusedxml>=0.7",
    "pdfplumber>=0.11",
    "rich>=13.9",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "ruff>=0.14",
    "pyright>=1.1.400",
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_agents"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
# Files from the upstream case repo stay byte-for-byte as provided.
extend-exclude = ["data", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "DTZ", "C4", "PIE", "RET", "PERF", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
include = ["src", "tests", "main.py"]
pythonVersion = "3.12"
# LangGraph state is a partial TypedDict by design: each node reads keys that
# the nodes before it wrote, which the graph's edges guarantee.
reportTypedDictNotRequiredAccess = false

[tool.coverage.run]
source = ["invoice_agents"]

[tool.coverage.report]
# CI fails below this. Run `make test` locally to see what is missing.
fail_under = 95
show_missing = true
skip_covered = true
