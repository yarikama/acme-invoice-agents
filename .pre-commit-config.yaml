repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(data|docs)/
      - id: end-of-file-fixer
        exclude: ^(data|docs)/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # Demo GIFs for the README are meant to be a few MB.
        exclude: ^docs/demo/
      - id: detect-private-key

  # Run the tools pinned in uv.lock, so hooks and CI use the same versions.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      # The repo goes public: block API keys, not just PEM private keys.
      - id: no-api-keys
        name: no API keys
        language: pygrep
        entry: '(sk-or-v1-[0-9a-f]{16,}|xai-[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{32,})'
        exclude: ^(\.env\.example|\.pre-commit-config\.yaml)$

      - id: web-format
        name: web prettier
        entry: bash -c 'cd web && npx prettier --check .'
        language: system
        files: ^web/
        pass_filenames: false
      - id: web-lint
        name: web eslint
        entry: bash -c 'cd web && npx eslint --max-warnings 0 .'
        language: system
        files: ^web/
        pass_filenames: false
      - id: web-typecheck
        name: web tsc
        entry: bash -c 'cd web && npx tsc -b'
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false
